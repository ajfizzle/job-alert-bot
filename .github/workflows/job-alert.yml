name: Daily job alert

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC every day; change to suit your time zone
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Lets the job save its "already sent" memory back to the repo
permissions:
  contents: write

# Never run two at once (would double-email)
concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run job alert
        env:
          JOB_ALERT_EMAIL_FROM: ${{ secrets.JOB_ALERT_EMAIL_FROM }}
          JOB_ALERT_EMAIL_PASSWORD: ${{ secrets.JOB_ALERT_EMAIL_PASSWORD }}
          JOB_ALERT_EMAIL_TO: ${{ secrets.JOB_ALERT_EMAIL_TO }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}   # optional
        run: python ats_job_alert.py

      # Runs even if the step above failed, so jobs that were already emailed
      # are still remembered and not sent again tomorrow.
      - name: Save the already-sent memory
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add each file separately: one missing file must not block the others.
          for f in seen_jobs.txt jobs.csv theirstack_usage.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update sent jobs [skip ci]"
            git push
          fi